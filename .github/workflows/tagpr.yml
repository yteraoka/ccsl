name: tagpr

on:
  push:
    branches:
      - main

# The job authenticates as a GitHub App instead of using GITHUB_TOKEN, so the
# workflow itself needs no write access.
permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with GITHUB_TOKEN does not start another workflow, so the
      # release workflow would never fire. An App installation token does.
      - name: Generate a token for the tagpr app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAGPR_APP_ID }}
          private-key: ${{ secrets.TAGPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
