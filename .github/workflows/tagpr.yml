name: tagpr

on:
  push:
    branches:
      - main

# The job authenticates as a GitHub App instead of using GITHUB_TOKEN, so the
# workflow itself needs no write access.
permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with GITHUB_TOKEN does not start another workflow, so the
      # release workflow would never fire. An App installation token does.
      # No permission-* inputs here: they narrow an installation token, and
      # requesting anything the installation does not already grant fails the
      # token request with a 422. The installation's own permissions apply.
      - name: Generate a token for the tagpr app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAGPR_APP_ID }}
          private-key: ${{ secrets.TAGPR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
